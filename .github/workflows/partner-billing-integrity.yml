name: Partner billing integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: partner-billing-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: partner_billing_smoke
          MARIADB_USER: smoke
          MARIADB_PASSWORD: billing-smoke-only
          MARIADB_ROOT_PASSWORD: billing-root-smoke-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, mbstring, pdo_mysql
          coverage: none

      - name: Run PHP regression tests
        run: |
          set -euo pipefail
          for test_file in tests/*.php; do
            if [ "$test_file" = "tests/partner-billing-mariadb-smoke.php" ]; then
              continue
            fi
            php "$test_file"
          done

      - name: Run browser contract tests
        run: |
          set -euo pipefail
          for test_file in tests/*.cjs; do
            node "$test_file"
          done

      - name: Run real MariaDB billing smoke test
        env:
          JG_PARTNER_DB_HOST: 127.0.0.1
          JG_PARTNER_DB_PORT: '3306'
          JG_PARTNER_DB_NAME: partner_billing_smoke
          JG_PARTNER_DB_USER: smoke
          JG_PARTNER_DB_PASSWORD: billing-smoke-only
          JG_PARTNER_BILLING_SMOKE_ALLOW_RESET: '1'
        run: php tests/partner-billing-mariadb-smoke.php
